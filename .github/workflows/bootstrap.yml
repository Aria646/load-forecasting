name: Build AEMO load data and EDA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Step 1 - download and build AEMO data
        run: python step1_download_build_aemo_data.py

      - name: Verify Step 1 output
        run: test -s aemo_merged_hourly_2021_2023.csv

      - name: Step 2 - generate EDA outputs
        run: python step2_eda_aemo_load_data.py

      - name: Verify Step 2 outputs
        run: |
          test -s results/aemo_eda_combined.png
          test -s results/eda_summary_stats.csv

      - name: Keep requested outputs and commit them
        shell: bash
        run: |
          rm -rf aemo_data
          rm -f download_log.csv
          rm -f .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate AEMO load data and EDA outputs"
          git push
